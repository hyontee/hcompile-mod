# Настройки проекта LAIRD
# После изменения этого файла перезапусти сервер.

# Стартовые/бонусные значения для новых игроков/бонусов
donate = 5000
money = 9000000
vip = 5
lvl = 10

# Название проекта/бренда. Этот текст показывается в диалогах и hostname сервера.
# Ключ называется nameserver из-за старого кода, но менять тут надо именно название проекта.
nameserver = Dev Kesha

# Ссылки проекта
tg = t.me/l4ird
vk = t.me/l4ird
site = t.me/l4ird

# ВНИМАНИЕ: whitelist здесь только подсказка для людей.
# Реально сервер использует отдельный файл scriptfiles/whitelist.ini:
# status=1 включает whitelist, status=0 выключает, player_0/player_1/... это разрешенные ники.
whitelist = смотри файл whitelist.ini

# Ник владельца/основателя с доступом к скрытым FULL-командам.
# Ник должен полностью совпадать с игровым ником.
full_access_name = Dev_Kesha

# Музыка на экране авторизации/регистрации.
audio_url = https://www.dropbox.com/scl/fi/yw48je352irzjqezvb8i8/2_5454372788179607425.mp4?rlkey=7i1hwx0s7uee5d5nfkbdolnhq&st=uqnrdlmi&dl=0

# Сообщение при очистке чата.
chat = {FFCD00}Чат был очищен администрацией
